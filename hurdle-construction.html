<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kwonmo.net</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f2f0ea; --ink: #1c1c1c; --mid: #5b5850; --dim: #8f8b80;
  --yellow: #f5c400; --board: #ffffff; --line: #dedad0;
  --tape: repeating-linear-gradient(-45deg, var(--yellow) 0 18px, var(--ink) 18px 36px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans KR", sans-serif;
}
/* 위아래 공사 테이프 */
body::before, body::after { content: ""; display: block; height: 14px; flex: none; background: var(--tape); }

main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; text-align: center; }
.art { width: min(300px, 70vw); height: auto; margin-bottom: 18px; }
h1 { margin: 0; font-family: "Black Han Sans", "Noto Sans KR", sans-serif; font-weight: 400; font-size: clamp(40px, 9vw, 68px); line-height: 1.1; letter-spacing: .02em; }
.en { margin: 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .35em; color: var(--mid); }
.lede { margin: 18px 0 30px; font-size: 16px; color: var(--mid); }

/* 공사 안내판 */
.board { width: min(380px, 100%); background: var(--board); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); text-align: left; }
.board-head { padding: 10px 16px; background: var(--yellow); border-bottom: 2px solid var(--ink); font-family: "Black Han Sans", sans-serif; font-size: 20px; letter-spacing: .5em; text-align: center; }
.board dl { margin: 0; padding: 6px 18px 10px; }
.row { display: grid; grid-template-columns: 5.2em 1fr; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.row:last-child { border-bottom: 0; }
dt { color: var(--dim); font-size: 13px; letter-spacing: .1em; }
dd { margin: 0; font-weight: 500; }

/* ── 숨은 PIN 입력칸 ─────────────────────────────
   안내판 ‘허가번호’ 값 자리에 놓인다. 테두리·배경·커서 없이 다른 값과 같은 글자로
   그려서, 비어 있을 땐 placeholder 가 인쇄된 번호처럼 보이고 입력하면 그 자리가 ●●●● 가 된다. */
#hurdle { margin: 0; display: contents; }
#hurdle input {
  width: 100%; min-width: 0; margin: 0; padding: 0;
  border: 0; outline: 0; background: transparent; border-radius: 0;
  font: inherit; font-weight: 500; color: var(--ink); letter-spacing: .04em;
  caret-color: transparent;
  -webkit-appearance: none; appearance: none;
}
#hurdle input::placeholder { color: var(--ink); opacity: 1; }
/* 제출 단추는 화면에서만 숨긴다(엔터·모바일 키패드 ‘이동’으로 제출) */
#hurdle button { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

footer { padding: 18px 16px 22px; font-size: 12px; color: var(--dim); text-align: center; letter-spacing: .05em; }

/* ── 시안 검토용 (실서비스엔 넣지 않음) ── */
.demo-only { position: fixed; right: 16px; bottom: 30px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 12px; }
.demo-only button { appearance: none; border: 1px solid var(--ink); background: #fff; color: var(--ink); padding: 6px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
.demo-only .toast { background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; display: none; max-width: 260px; text-align: left; line-height: 1.5; }
.demo-only .toast.on { display: block; }
body.reveal #hurdle input { outline: 2px dashed #d33; outline-offset: 3px; background: rgba(221,51,51,.06); }
</style>
</head>
<body>
<main>
  <svg class="art" viewBox="0 0 300 170" aria-hidden="true">
    <!-- 바닥 그림자 -->
    <ellipse cx="150" cy="160" rx="135" ry="7" fill="#1c1c1c" opacity=".08"/>
    <!-- 바리케이드 다리 -->
    <path d="M70 58 L52 158 M90 58 L106 158 M200 58 L184 158 M220 58 L238 158" stroke="#1c1c1c" stroke-width="7" stroke-linecap="round"/>
    <!-- 바리케이드 판 두 장 -->
    <defs>
      <pattern id="stripe" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
        <rect width="12" height="24" fill="#f5c400"/><rect x="12" width="12" height="24" fill="#1c1c1c"/>
      </pattern>
    </defs>
    <rect x="34" y="44" width="232" height="34" rx="4" fill="url(#stripe)" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="44" y="96" width="212" height="24" rx="4" fill="url(#stripe)" stroke="#1c1c1c" stroke-width="3"/>
    <!-- 경광등 -->
    <rect x="64" y="30" width="18" height="14" rx="3" fill="#1c1c1c"/>
    <circle cx="73" cy="24" r="10" fill="#ff8a1f"/><circle cx="73" cy="24" r="16" fill="#ff8a1f" opacity=".18"/>
    <rect x="218" y="30" width="18" height="14" rx="3" fill="#1c1c1c"/>
    <circle cx="227" cy="24" r="10" fill="#ff8a1f"/><circle cx="227" cy="24" r="16" fill="#ff8a1f" opacity=".18"/>
    <!-- 라바콘 -->
    <path d="M276 158 L262 158 L268 112 L270 112 Z" fill="#ff7a1a"/>
    <path d="M266 132 h6.5 l1 8 h-8.5z" fill="#fff"/>
    <rect x="256" y="156" width="26" height="5" rx="1.5" fill="#1c1c1c"/>
  </svg>

  <h1>사이트 공사 중</h1>
  <p class="en">UNDER CONSTRUCTION</p>
  <p class="lede">더 나은 모습으로 다시 찾아뵙겠습니다.</p>

  <section class="board" aria-label="공사 안내">
    <div class="board-head">공사안내</div>
    <dl>
      <div class="row"><dt>공 사 명</dt><dd>kwonmo.net 리모델링</dd></div>
      <div class="row"><dt>공사기간</dt><dd>2026. 10. ~ 완료 시까지</dd></div>
      <div class="row"><dt>시 공</dt><dd>kwonmo</dd></div>
      <div class="row"><dt>허가번호</dt>
        <dd>
          <form id="hurdle" method="post" action="/_hurdle/login">
            <input type="password" name="pin" inputmode="numeric" autocomplete="off" required autofocus aria-label="PIN" placeholder="제 2026-0107 호">
            <button type="submit">→</button>
          </form>
        </dd>
      </div>
    </dl>
  </section>
</main>
<footer>kwonmo.net · 이용에 불편을 드려 죄송합니다</footer>

<!-- 시안 검토용 — 실서비스엔 넣지 않음 -->
<div class="demo-only">
  <div class="toast" id="toast"></div>
  <button type="button" id="reveal">숨은 입력칸 보기</button>
</div>
<script>
(function () {
  var toast = document.getElementById('toast');
  document.getElementById('reveal').addEventListener('click', function () {
    var on = document.body.classList.toggle('reveal');
    this.textContent = on ? '숨기기' : '숨은 입력칸 보기';
  });
  // 시안 파일에선 실제 /_hurdle/login 으로 보내지 않고 동작만 보여 준다
  document.getElementById('hurdle').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = this.pin.value.length;
    toast.textContent = '시안: PIN ' + n + '자리를 POST /_hurdle/login 으로 보냄 (실서비스에선 실제 제출)';
    toast.classList.add('on');
    setTimeout(function () { toast.classList.remove('on'); }, 2600);
  });
})();
</script>
</body>
</html>
